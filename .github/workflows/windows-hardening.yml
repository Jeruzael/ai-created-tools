name: Windows Hardening

on:
  push:
    branches: [master, codex/v1-29-security-hardening]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  regression:
    name: Windows / Python ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate syntax, imports, startup, dependencies and private paths
        run: python tests/verify_project.py --checks-only
      - name: Run regression, API, concurrency, persistence and JavaScript checks
        run: python tests/verify_project.py --tests-only
