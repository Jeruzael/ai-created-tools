<section id="tab-history" class="tab-panel remaining-workspace hidden" aria-label="Scan History">
    <div class="remaining-heading"><h2>Scan History</h2><button id="refreshHistory" type="button">Refresh history</button></div>
    <div class="remaining-toolbar"><label class="remaining-search" for="historySearch">Search history<input id="historySearch" type="search" placeholder="Folder, date, status or scan ID" autocomplete="off" spellcheck="false"></label><label for="historySort">Sort<select id="historySort"><option value="date-desc">Date: newest first</option><option value="date-asc">Date: oldest first</option><option value="root-asc">Root: A to Z</option><option value="root-desc">Root: Z to A</option><option value="size-desc">Scanned size: largest first</option><option value="size-asc">Scanned size: smallest first</option><option value="files-desc">Files: most first</option><option value="files-asc">Files: fewest first</option><option value="skipped-desc">Skipped: most first</option><option value="skipped-asc">Skipped: fewest first</option><option value="status-asc">Status: A to Z</option></select></label></div>
    <p id="historyStatus" class="remaining-note" role="status" aria-live="polite">Scan history is not loaded.</p>
    <div id="historyTableScroll" class="remaining-table remaining-history-table" role="region" aria-label="Saved disk scans" aria-busy="false" tabindex="0"><table><caption class="sr-only">Saved disk scan summaries</caption><thead><tr><th scope="col">Date</th><th scope="col">Status</th><th scope="col">Root</th><th scope="col">Scanned size</th><th scope="col">Files</th><th scope="col">Skipped</th><th scope="col">Action</th></tr></thead><tbody id="historyRows"><tr><td colspan="7">Scan history is not loaded.</td></tr></tbody></table></div>
    <div class="remaining-pager"><label for="historyPageSize">Rows<select id="historyPageSize"><option>25</option><option>50</option><option>100</option></select></label><span id="historyPageInfo" role="status" aria-live="polite">0 records; page 1/1</span><button id="historyPrevious" type="button" class="icon-button" aria-label="Previous history page" title="Previous history page" disabled><svg class="icon" aria-hidden="true"><use href="#icon-chevron-left"></use></svg></button><button id="historyNext" type="button" class="icon-button" aria-label="Next history page" title="Next history page" disabled><svg class="icon" aria-hidden="true"><use href="#icon-chevron-right"></use></svg></button></div>
</section>
